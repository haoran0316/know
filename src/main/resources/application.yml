spring:
  profiles:
    active: dev # 支持dev开发环境

  application:
    name: spring-ai3

  ai:
    openai:
      api-key: ${lhr.ai.openai.api-key}
      base-url: ${lhr.ai.openai.base-url}
      chat:
        model: ${lhr.ai.openai.chat.model}

# 日志配置
logging:
  level:
    org.springframework.ai.chat.client.advisor: debug
    com.itheima.springai: debug
