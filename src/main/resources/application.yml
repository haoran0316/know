spring:
  profiles:
    active: dev # 支持dev开发环境

  application:
    name: spring-ai3

  ai:
    openai:
      api-key: ${lhr.ai.openai.api-key}
      base-url: ${lhr.ai.openai.base-url}
      chat:
        model: ${lhr.ai.openai.chat.model}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/springai?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123

# 日志配置
logging:
  level:
    org.springframework.ai: debug
    com.itheima.springai: debug
